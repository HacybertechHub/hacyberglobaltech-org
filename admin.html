  if (window.playablesSDK) return;

  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

        eventName,
        JSON.stringify(p)

    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {

    errorSent = true;

      colno: event.colno || 0,

    complete: function(score) {

        score: score,

      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',

<meta charset="UTF-8">
<title>Hacyber Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#111;padding:30px;border-radius:12px;width:90%;max-width:400px;border:1px solid #333}
input{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #444;color:#fff;border-radius:6px}
button{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer}
.hidden{display:none}
.order{background:#222;padding:15px;margin:10px 0;border-radius:8px;border-left:3px solid #ffaa00}
</style>
</head>
<body>
<div class="box" id="login">
  <h2>Admin Login</h2>
  <input type="password" id="pin" placeholder="Enter PIN">
  <button onclick="login()">Unlock</button>
</div>

<div class="box hidden" id="panel">
  <h2>Orders</h2>
  <div id="orders"></div>
  <button onclick="addTest()">+ Add Test Order</button>
</div>

<audio id="beep" preload="auto" src="data:audio/wav;base64,UklGRnoAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACAgICAgICA"></audio>

<script>
function login(){
  if(document.getElementById('pin').value==='2026'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
  } else alert('Wrong PIN');
}
let orders=[];
function addTest(){
  const id = Date.now();
  orders.push({id, time:Date.now(), name:'Customer'});
  render();
  setTimeout(()=>{document.getElementById('beep').play(); if(Notification.permission==='granted') new Notification('30-min reminder: Send bot link!'); alert('30 MINUTE REMINDER');}, 30*60*1000);
}
function render(){
  document.getElementById('orders').innerHTML = orders.map(o=>`<div class="order">Order #${o.id}<br><small>${new Date(o.time).toLocaleTimeString()}</small></div>`).join('');
}
if('Notification' in window) Notification.requestPermission();
</script>


</body></html>
